openapi: 3.1.0
info:
  title: TTS Phrasebook API
  description: >
    Personal language learning phrasebook. Saves phrases with TTS audio to S3
    and metadata to DynamoDB. All requests require a short-lived HMAC-TOTP token.
  version: 1.0.0

servers:
  - url: https://<your-lambda-function-url>
    description: Lambda Function URL (set LAMBDA_URL in GitHub Secrets after first deploy)

security:
  - AppToken: []

components:
  securitySchemes:
    AppToken:
      type: apiKey
      in: header
      name: x-app-token
      description: >
        HMAC-SHA256 TOTP token. Computed as `HMAC-SHA256(HMAC_SECRET, floor(Date.now() / 30000))`,
        hex-encoded. Expires every 30 seconds; the server accepts the current and previous window.

  parameters:
    Namespace:
      name: x-namespace
      in: header
      required: false
      description: >
        Optional private-library selector. When present, phrases are read and written
        in an isolated DynamoDB partition keyed by a hash of this value (normalised:
        trimmed + lowercased). Absent ⇒ the shared `default` library. The browser
        supplies it from a `#k=<word>` URL fragment persisted to localStorage.
      schema:
        type: string
      example: "marmalade"

  schemas:
    Phrase:
      type: object
      required: [phraseId, userId, text, languageCode, languageName, nonLatin, normalS3Key, slowS3Key, createdAt]
      properties:
        phraseId:
          type: string
          format: uuid
          example: "3f2a1b4c-1234-5678-abcd-ef0123456789"
        userId:
          type: string
          example: "default"
        text:
          type: string
          example: "おはようございます"
        languageCode:
          type: string
          description: BCP-47 code. Free-form — may be a user-entered code that the TTS does not support.
          example: "ja-JP"
        languageName:
          type: string
          description: Human-readable language name; the grouping key in the UI.
          example: "Japanese"
        nonLatin:
          type: boolean
          description: True if the script is non-Latin and a romanization field should be shown.
          example: true
        normalS3Key:
          type: string
          description: Content-addressed S3 key for the normal-pace audio file.
          example: "audio/ja-JP/a3f1b2c4d5e6f7890abcdef1234567890abcdef1234567890abcdef1234567890-normal.mp3"
        slowS3Key:
          type: string
          description: Content-addressed S3 key for the slow-pace audio file.
          example: "audio/ja-JP/a3f1b2c4d5e6f7890abcdef1234567890abcdef1234567890abcdef1234567890-slow.mp3"
        createdAt:
          type: string
          format: date-time
          example: "2024-11-01T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-11-02T08:15:00.000Z"
        transcription:
          type: string
          example: "Ohayou gozaimasu"
        translation:
          type: string
          example: "Good morning"
        tags:
          type: array
          items:
            type: string
          example: ["greetings", "daily"]

    SavePhraseRequest:
      type: object
      required: [text, languageName, nonLatin, normalAudioBase64, slowAudioBase64]
      properties:
        text:
          type: string
          description: The phrase to save.
          example: "おはようございます"
        languageCode:
          type: string
          description: BCP-47 language code. Defaults to `en-AU`. Free-form — may be a user-entered code that the TTS does not support.
          default: "en-AU"
          example: "ja-JP"
        languageName:
          type: string
          description: Human-readable language name.
          example: "Japanese"
        nonLatin:
          type: boolean
          description: True if a romanization field should be shown for this language.
          example: true
        normalAudioBase64:
          type: string
          format: byte
          description: Normal-pace MP3 audio, base64-encoded. Generated by the browser via the Google TTS proxy.
        slowAudioBase64:
          type: string
          format: byte
          description: Slow-pace MP3 audio, base64-encoded. Generated by the browser via the Google TTS proxy.
        transcription:
          type: string
          example: "Ohayou gozaimasu"
        translation:
          type: string
          example: "Good morning"
        tags:
          type: array
          items:
            type: string
          example: ["greetings", "daily"]

    UpdatePhraseRequest:
      type: object
      properties:
        transcription:
          type: string
          example: "Ohayou gozaimasu"
        translation:
          type: string
          example: "Good morning"
        tags:
          type: array
          items:
            type: string
          example: ["greetings", "daily"]
      description: >
        Only `transcription`, `translation`, and `tags` can be updated. Text and audio are
        immutable — changing them would require a new TTS call and a new save.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Missing text"

paths:
  /phrases:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      summary: List all saved phrases
      description: Returns all phrases in the active library (see `x-namespace`), sorted by `createdAt` descending.
      operationId: listPhrases
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [phrases]
                properties:
                  phrases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Phrase"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Save a phrase
      description: >
        Uploads the provided audio to S3 (content-addressed by SHA-256 of the normalized text)
        and writes a record to DynamoDB. Duplicate text in the same language reuses the
        existing S3 object but always creates a new DynamoDB record.
      operationId: savePhrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePhraseRequest"
      responses:
        "200":
          description: Phrase saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "400":
          description: Validation error (missing required fields or invalid JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /phrases/{phraseId}:
    parameters:
      - name: phraseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/Namespace"

    put:
      summary: Update a phrase
      description: Updates `transcription` and/or `translation`. Sets `updatedAt` to the current time.
      operationId: updatePhrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhraseRequest"
      responses:
        "200":
          description: Updated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "400":
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a phrase
      operationId: deletePhrase
      responses:
        "200":
          description: Phrase deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
