openapi: 3.1.0
info:
  title: TTS Phrasebook API
  description: >
    Personal language learning phrasebook. Saves phrases with TTS audio to S3
    and metadata to DynamoDB. All requests require a short-lived HMAC-TOTP token.
  version: 1.0.0

servers:
  - url: https://<your-lambda-function-url>
    description: Lambda Function URL (set LAMBDA_URL in GitHub Secrets after first deploy)

security:
  - AppToken: []

components:
  securitySchemes:
    AppToken:
      type: apiKey
      in: header
      name: x-app-token
      description: >
        HMAC-SHA256 TOTP token. Computed as `HMAC-SHA256(HMAC_SECRET, floor(Date.now() / 30000))`,
        hex-encoded. Expires every 30 seconds; the server accepts the current and previous window.

  schemas:
    Phrase:
      type: object
      required: [phraseId, userId, text, languageCode, s3Key, createdAt]
      properties:
        phraseId:
          type: string
          format: uuid
          example: "3f2a1b4c-1234-5678-abcd-ef0123456789"
        userId:
          type: string
          example: "default"
        text:
          type: string
          example: "おはようございます"
        languageCode:
          type: string
          example: "ja-JP"
        s3Key:
          type: string
          description: Content-addressed S3 key for the audio file.
          example: "audio/ja-JP/a3f1b2c4d5e6f7890abcdef1234567890abcdef1234567890abcdef1234567890.mp3"
        createdAt:
          type: string
          format: date-time
          example: "2024-11-01T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-11-02T08:15:00.000Z"
        transcription:
          type: string
          example: "Ohayou gozaimasu"
        translation:
          type: string
          example: "Good morning"

    SavePhraseRequest:
      type: object
      required: [text, audioBase64]
      properties:
        text:
          type: string
          description: The phrase to save.
          example: "おはようございます"
        languageCode:
          type: string
          description: BCP-47 language code. Defaults to `en-AU`.
          default: "en-AU"
          example: "ja-JP"
        audioBase64:
          type: string
          format: byte
          description: MP3 audio content, base64-encoded. Generated by the browser via the Google TTS proxy.
        transcription:
          type: string
          example: "Ohayou gozaimasu"
        translation:
          type: string
          example: "Good morning"

    UpdatePhraseRequest:
      type: object
      properties:
        transcription:
          type: string
          example: "Ohayou gozaimasu"
        translation:
          type: string
          example: "Good morning"
      description: >
        Only `transcription` and `translation` can be updated. Text and audio are
        immutable — changing them would require a new TTS call and a new save.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Missing text"

paths:
  /phrases:
    get:
      summary: List all saved phrases
      description: Returns all phrases for the default user, sorted by `createdAt` descending.
      operationId: listPhrases
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [phrases]
                properties:
                  phrases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Phrase"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Save a phrase
      description: >
        Uploads the provided audio to S3 (content-addressed by SHA-256 of the normalized text)
        and writes a record to DynamoDB. Duplicate text in the same language reuses the
        existing S3 object but always creates a new DynamoDB record.
      operationId: savePhrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePhraseRequest"
      responses:
        "200":
          description: Phrase saved
          content:
            application/json:
              schema:
                type: object
                required: [phraseId, s3Key]
                properties:
                  phraseId:
                    type: string
                    format: uuid
                  s3Key:
                    type: string
        "400":
          description: Validation error (missing required fields or invalid JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /phrases/{phraseId}:
    parameters:
      - name: phraseId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      summary: Update a phrase
      description: Updates `transcription` and/or `translation`. Sets `updatedAt` to the current time.
      operationId: updatePhrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhraseRequest"
      responses:
        "200":
          description: Updated phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phrase"
        "400":
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a phrase
      operationId: deletePhrase
      responses:
        "200":
          description: Phrase deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
